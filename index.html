<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAISA — Date Drive</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #ffb8d1 0%, #bde4ff 54%, #b9e5aa 55%, #82cb73 100%);
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.72), transparent 34%);
      pointer-events: none;
    }

    .title {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 8px;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      white-space: nowrap;
      z-index: 4;
      pointer-events: none;
    }

    .cloud {
      position: absolute;
      font-size: 60px;
      opacity: 0.9;
      animation: drift 30s linear infinite;
    }

    .cloud.one { top: 90px;  left: -100px; animation-duration: 35s; }
    .cloud.two { top: 160px; left: -100px; animation-duration: 48s; animation-delay: 5s; }

    @keyframes drift {
      from { transform: translateX(-120px); }
      to   { transform: translateX(110vw); }
    }

    .road {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 180px;
      background: #4a4a55;
      border-top: 6px solid #33333c;
    }

    .road-line {
      position: absolute;
      top: 50%;
      left: 0;
      width: 200%;
      height: 8px;
      background: repeating-linear-gradient(
        90deg,
        #ffd93d 0px,
        #ffd93d 70px,
        transparent 70px,
        transparent 140px
      );
      animation: road-move 1s linear infinite;
    }

    @keyframes road-move {
      from { transform: translateX(0); }
      to   { transform: translateX(-140px); }
    }

    .car {
      --car-scale: 1;
      position: absolute;
      bottom: 95px;
      left: -330px;
      width: 300px;
      height: 90px;
      z-index: 8;
      animation: drive-across 9s linear infinite;
    }

    @keyframes drive-across {
      from { transform: translateX(0); }
      to   { transform: translateX(calc(100vw + 660px)); }
    }

    @keyframes drive-across-compact {
      from { transform: translateX(0); }
      to   { transform: translateX(calc(100vw + 540px)); }
    }

    .car-body {
      position: relative;
      width: 300px;
      height: 90px;
      background: linear-gradient(180deg, #ff6b81, #e84118);
      border-radius: 22px 40px 12px 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      transform-origin: left bottom;
      z-index: 2;
      animation: car-bounce 0.35s ease-in-out infinite alternate;
    }

    @keyframes car-bounce {
      from { transform: translateY(0) rotate(-0.4deg) scale(var(--car-scale)); }
      to   { transform: translateY(-5px) rotate(0.4deg) scale(var(--car-scale)); }
    }

    .car-top {
      position: absolute;
      top: -55px;
      left: 45px;
      width: 180px;
      height: 70px;
      background: linear-gradient(180deg, #ff8ba0, #ff6b81);
      border-radius: 30px 40px 0 0;
    }

    .window {
      position: absolute;
      top: -45px;
      width: 70px;
      height: 52px;
      background: linear-gradient(180deg, #d9f1ff, #9fd8f5);
      border-radius: 12px 12px 0 0;
    }

    .window.left  { left: 62px; }
    .window.right { left: 145px; border-radius: 12px; }

    .driver {
      position: absolute;
      top: -42px;
      left: 160px;
      font-size: 38px;
      z-index: 3;
      animation: driver-bounce 0.35s ease-in-out infinite alternate;
    }

    @keyframes driver-bounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-3px); }
    }

    .wheel {
      position: absolute;
      bottom: -28px;
      width: 56px;
      height: 56px;
      background: radial-gradient(circle, #9a9a9a 25%, #2d2d2d 30%, #111 100%);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    .wheel.front { right: 30px; }
    .wheel.back  { left: 30px; }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .heart-trail {
      position: absolute;
      left: 18px;
      top: 8px;
      color: #ff2865;
      font-size: 27px;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      filter: drop-shadow(0 3px 3px rgba(118, 15, 52, 0.25));
      animation: float-heart 1.8s ease-out infinite;
    }

    .heart-trail.h2 {
      top: 28px;
      font-size: 21px;
      animation-delay: 0.55s;
    }

    .heart-trail.h3 {
      top: -10px;
      font-size: 18px;
      animation-delay: 1.1s;
    }

    @keyframes float-heart {
      0% {
        transform: translate(0, 34px) scale(0.45) rotate(-10deg);
        opacity: 0;
      }
      18% { opacity: 0.95; }
      100% {
        transform: translate(-175px, -48px) scale(1.2) rotate(16deg);
        opacity: 0;
      }
    }

    .flower {
      position: absolute;
      font-size: 34px;
      z-index: 6;
      transform-origin: bottom center;
      animation: sway 2s ease-in-out infinite alternate;
    }

    @keyframes sway {
      from { transform: rotate(-8deg); }
      to   { transform: rotate(8deg); }
    }

    .flower.f1 { left: 4%;  bottom: 180px; }
    .flower.f2 { left: 14%; bottom: 176px; font-size: 28px; animation-delay: 0.4s; }
    .flower.f3 { left: 26%; bottom: 182px; animation-delay: 0.8s; }
    .flower.f4 { left: 68%; bottom: 178px; font-size: 28px; animation-delay: 0.2s; }
    .flower.f5 { left: 80%; bottom: 182px; animation-delay: 0.6s; }
    .flower.f6 { left: 92%; bottom: 176px; animation-delay: 1s; }

    .invitation {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 520px);
      min-height: 230px;
      padding: 24px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.96), rgba(255, 238, 245, 0.94));
      box-shadow: 0 18px 45px rgba(126, 36, 75, 0.22);
      backdrop-filter: blur(8px);
      text-align: center;
      z-index: 20;
    }

    .invitation::before {
      content: "\2665";
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      margin-bottom: 10px;
      border-radius: 50%;
      background: #ffe0ea;
      color: #dc2d68;
      font-size: 24px;
    }

    .invitation h1 {
      margin-bottom: 14px;
      color: #c52862;
      font-size: clamp(23px, 5vw, 34px);
      line-height: 1.2;
    }

    .date-plan {
      display: grid;
      gap: 8px;
      margin-bottom: 8px;
      text-align: left;
    }

    .venue {
      padding: 10px 12px;
      border-radius: 14px;
      background: #fff3f7;
      color: #6f2441;
      font-size: 15px;
      line-height: 1.35;
    }

    .venue strong {
      display: block;
      color: #a61f52;
      font-size: 17px;
    }

    .day-label {
      color: #6f2441;
      font-size: 14px;
      font-weight: 700;
    }

    #day-select {
      width: 100%;
      min-height: 42px;
      padding: 8px 12px;
      border: 2px solid #f1a9c0;
      border-radius: 12px;
      background: #fff;
      color: #5d1733;
      font: inherit;
      font-size: 16px;
      cursor: pointer;
    }

    #day-select:focus-visible {
      border-color: #d72f69;
      outline: 3px solid rgba(215, 47, 105, 0.2);
    }

    .field-error {
      min-height: 18px;
      color: #b42318;
      font-size: 13px;
      font-weight: 700;
      text-align: left;
    }

    .actions {
      position: relative;
      height: 74px;
    }

    .answer {
      position: absolute;
      top: 10px;
      min-width: 104px;
      padding: 12px 20px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      font: inherit;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.16);
    }

    .answer:focus-visible {
      outline: 4px solid #ffd93d;
      outline-offset: 3px;
    }

    #yes-button {
      left: calc(50% - 116px);
      background: #e83e75;
    }

    #yes-button:hover {
      background: #c52862;
    }

    #no-button {
      left: calc(50% + 12px);
      background: #687582;
      transition: left 0.12s ease, top 0.12s ease;
    }

    .reply {
      display: none;
      margin-top: 8px;
      color: #8f1745;
      font-size: 16px;
      line-height: 1.45;
    }

    .reply.show {
      display: block;
    }

    .reply-title {
      margin-bottom: 8px;
      font-weight: 800;
    }

    .message-copy {
      display: block;
      margin-bottom: 14px;
      padding: 12px;
      border-radius: 14px;
      background: #fff3f7;
      color: #701b3c;
      font-weight: 700;
    }

    .copy-button {
      width: 100%;
      padding: 12px 18px;
      border: 0;
      border-radius: 999px;
      background: #0866ff;
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(8, 102, 255, 0.25);
    }

    .copy-button:hover {
      background: #0057dc;
    }

    .copy-button:focus-visible {
      outline: 4px solid #ffd93d;
      outline-offset: 3px;
    }

    .send-status {
      display: block;
      min-height: 18px;
      margin-top: 8px;
      color: #4f3150;
      font-size: 13px;
    }

    .invitation.accepted {
      min-height: 0;
    }

    .invitation.accepted::before,
    .invitation.accepted h1,
    .invitation.accepted .date-plan {
      display: none;
    }

    @media (max-height: 640px) {
      .invitation {
        top: 12px;
        min-height: 200px;
        padding: 16px;
      }

      .invitation h1 {
        margin-bottom: 10px;
      }
    }

    @media (max-width: 600px) {
      .cloud {
        font-size: 44px;
      }

      .cloud.one {
        top: 120px;
      }

      .cloud.two {
        display: none;
      }

      .road {
        height: 150px;
      }

      .car {
        --car-scale: 0.78;
        bottom: 70px;
        left: -270px;
        width: 234px;
        height: 70px;
        animation-name: drive-across-compact;
        animation-duration: 7.5s;
      }

      .heart-trail {
        left: 12px;
        font-size: 22px;
      }

      .heart-trail.h2 {
        font-size: 18px;
      }

      .heart-trail.h3 {
        font-size: 16px;
      }

      @keyframes float-heart {
        0% {
          transform: translate(0, 28px) scale(0.45) rotate(-10deg);
          opacity: 0;
        }
        18% { opacity: 0.95; }
        100% {
          transform: translate(-120px, -38px) scale(1.1) rotate(16deg);
          opacity: 0;
        }
      }

      .flower {
        font-size: 28px;
      }

      .flower.f1,
      .flower.f3,
      .flower.f5 {
        bottom: 150px;
      }

      .flower.f2,
      .flower.f4,
      .flower.f6 {
        display: none;
      }

      .invitation {
        top: max(12px, env(safe-area-inset-top));
        width: calc(100% - 24px);
        min-height: 210px;
        padding: 18px 14px;
        border-radius: 22px;
      }

      .invitation::before {
        width: 34px;
        height: 34px;
        margin-bottom: 6px;
        font-size: 20px;
      }

      .invitation h1 {
        margin-bottom: 12px;
        font-size: clamp(22px, 7vw, 29px);
      }

      .actions {
        height: 68px;
      }

      .answer {
        min-width: 96px;
        padding: 11px 16px;
        font-size: 17px;
      }

      #yes-button {
        left: calc(50% - 100px);
      }

      #no-button {
        left: calc(50% + 4px);
      }

      .reply {
        margin-top: 4px;
        font-size: 17px;
      }

      .venue {
        padding: 8px 10px;
      }

      #day-select {
        min-height: 40px;
      }
    }

    @media (max-width: 360px) {
      .invitation {
        width: calc(100% - 16px);
        padding: 14px 10px;
      }

      .invitation h1 {
        font-size: 21px;
      }

      .answer {
        min-width: 88px;
        padding-inline: 12px;
      }

      #yes-button {
        left: calc(50% - 92px);
      }

      #no-button {
        left: calc(50% + 4px);
      }

      .reply {
        font-size: 16px;
      }

      .message-copy {
        padding: 10px;
      }
    }

    @media (max-width: 600px) and (max-height: 640px) {
      .invitation {
        min-height: 190px;
        padding-block: 12px;
      }

      .invitation::before {
        display: none;
      }

      .invitation h1 {
        margin-bottom: 8px;
      }
    }

    @media (max-height: 520px) and (orientation: landscape) {
      .road {
        height: 120px;
      }

      .car {
        --car-scale: 0.72;
        bottom: 56px;
        left: -250px;
        width: 216px;
        height: 65px;
        animation-name: drive-across-compact;
        animation-duration: 7s;
      }

      .flower.f1,
      .flower.f3,
      .flower.f5 {
        bottom: 120px;
      }

      .invitation {
        top: max(10px, env(safe-area-inset-top));
        left: max(12px, env(safe-area-inset-left));
        transform: none;
        width: min(54vw, 440px);
        min-height: 0;
        padding: 12px 14px;
        border-radius: 18px;
      }

      .invitation::before {
        display: none;
      }

      .invitation h1 {
        margin-bottom: 6px;
        font-size: 20px;
      }

      .actions {
        height: 54px;
      }

      .answer {
        top: 4px;
        min-width: 86px;
        padding: 9px 12px;
        font-size: 16px;
      }

      #yes-button {
        left: calc(50% - 90px);
      }

      #no-button {
        left: calc(50% + 4px);
      }

      .reply {
        margin-top: 2px;    
        font-size: 15px;
      }

      .date-plan {
        gap: 5px;
        margin-bottom: 4px;
      }

      .venue {
        padding: 6px 9px;
        font-size: 13px;
      }

      .venue strong {
        font-size: 15px;
      }

      #day-select {
        min-height: 36px;
        padding-block: 5px;
        font-size: 14px;
      }

      .field-error {
        min-height: 15px;
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cloud,
      .road-line,
      .car-body,
      .driver,
      .wheel,
      .flower {
        animation: none;
      }

      .car {
        left: 50%;
        transform: translateX(-50%);
        animation: none;
      }

      .heart-trail {
        display: none;
      }
    }
  </style>
</head>


<body>

  <main class="invitation" aria-labelledby="date-question">
    <h1 id="date-question">Let&rsquo;s have a date after your class this week?</h1>
    <div class="date-plan">
      <p class="venue">
        <strong>&#128205; Sloop VR Experience</strong>
        SM Ecoland
      </p>
      <label class="day-label" for="day-select">Choose a day after class</label>
      <select id="day-select" required>
        <option value="" disabled selected>Select a day</option>
        <option value="Monday">Monday</option>
        <option value="Tuesday">Tuesday</option>
        <option value="Wednesday">Wednesday</option>
        <option value="Thursday">Thursday</option>
        <option value="Friday">Friday</option>
        <option value="Thursday">Saturday</option>
        <option value="Friday">Sunday</option>
      </select>
      <p class="field-error" id="day-error" role="alert"></p>
    </div>
    <div class="actions" id="actions">
      <button class="answer" id="yes-button" type="button">Yes &#128150;</button>
      <button class="answer" id="no-button" type="button" aria-label="No, but this button runs away">No</button>
    </div>
    <div class="reply" id="reply" aria-live="polite">
      <p class="reply-title">Send this to me on Messenger:</p>
      <strong class="message-copy" id="message-text"></strong>
      <button class="copy-button" id="copy-button" type="button">Copy message</button>
      <small class="send-status" id="send-status"></small>
    </div>
  </main>

  <div class="cloud one">☁️</div>
  <div class="cloud two">☁️</div>

  <!-- Flowers along the road -->
  <div class="flower f1">🌸</div>
  <div class="flower f2">🌺</div>
  <div class="flower f3">🌷</div>
  <div class="flower f4">🌻</div>
  <div class="flower f5">🌸</div>
  <div class="flower f6">🌷</div>

  <!-- Car with girl driver -->
  <div class="car">
    <span class="heart-trail h1" aria-hidden="true">&#10084;&#65039;</span>
    <span class="heart-trail h2" aria-hidden="true">&#10084;&#65039;</span>
    <span class="heart-trail h3" aria-hidden="true">&#10084;&#65039;</span>
    <div class="car-body">
      <div class="title">SAISA</div>
      <div class="car-top"></div>
      <div class="window left"></div>
      <div class="window right"></div>
      <div class="driver">👩</div>
      <div class="wheel front"></div>
      <div class="wheel back"></div>
    </div>
  </div>

  <div class="road">
    <div class="road-line"></div>
  </div>

  <script>
    const actions = document.getElementById("actions");
    const noButton = document.getElementById("no-button");
    const yesButton = document.getElementById("yes-button");
    const invitation = document.querySelector(".invitation");
    const daySelect = document.getElementById("day-select");
    const dayError = document.getElementById("day-error");
    const reply = document.getElementById("reply");
    const messageText = document.getElementById("message-text");
    const copyButton = document.getElementById("copy-button");
    const sendStatus = document.getElementById("send-status");

    function moveNoButton(event) {
      event.preventDefault();
      const maxLeft = Math.max(0, actions.clientWidth - noButton.offsetWidth);
      const maxTop = Math.max(0, actions.clientHeight - noButton.offsetHeight);
      noButton.style.left = `${Math.random() * maxLeft}px`;
      noButton.style.top = `${Math.random() * maxTop}px`;
    }

    ["pointerenter", "pointerdown", "focus", "click"].forEach((eventName) => {
      noButton.addEventListener(eventName, moveNoButton);
    });

    yesButton.addEventListener("click", () => {
      const selectedDay = daySelect.value;

      if (!selectedDay) {
        dayError.textContent = "Please select a day first.";
        daySelect.focus();
        return;
      }

      dayError.textContent = "";
      messageText.textContent = `Yes let's have a day after class this week — ${selectedDay} at Sloop VR Experience, SM Ecoland.`;
      actions.hidden = true;
      invitation.classList.add("accepted");
      reply.classList.add("show");
    });

    copyButton.addEventListener("click", async () => {
      const message = messageText.textContent;

      try {
        await navigator.clipboard.writeText(message);
        sendStatus.textContent = "Message copied. Paste it into your Messenger conversation.";
      } catch {
        sendStatus.textContent = "Copy the message above, then paste it into Messenger.";
      }
    });
  </script>

</body>
</html>
